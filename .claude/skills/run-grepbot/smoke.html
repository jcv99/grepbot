<!DOCTYPE html>
<!--
  GrepBot smoke harness — NOT a real game. Stubs the backbone models
  and bridge just enough to let src/core.js boot without throwing.
  The bot's loops will spin and find nothing; we only verify that
  init does not error. Driver reads document.title after settle.
-->
<html>
<head>
<meta charset="utf-8">
<title>SMOKE_PENDING</title>
<style>
  body { font: 13px monospace; background: #1a1d23; color: #ddd; margin: 0; padding: 8px; }
  #log { white-space: pre-wrap; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<div id="ui_box"></div>
<div id="gp_window_mgr"></div>
<pre id="log"></pre>

<script>
// ---- error capture ----
window.__SMOKE_ERRORS__ = [];
window.addEventListener('error', (e) => {
  window.__SMOKE_ERRORS__.push({
    where: 'window.error',
    msg: e.message,
    src: e.filename,
    line: e.lineno,
    col: e.colno,
    stack: e.error && e.error.stack
  });
});
window.addEventListener('unhandledrejection', (e) => {
  window.__SMOKE_ERRORS__.push({
    where: 'unhandledrejection',
    reason: String(e.reason && (e.reason.stack || e.reason.message || e.reason))
  });
});
const origConsoleError = console.error;
console.error = function (...a) {
  window.__SMOKE_ERRORS__.push({ where: 'console.error', args: a.map(x => {
    try { return typeof x === 'string' ? x : JSON.stringify(x).slice(0, 400); }
    catch (_) { return String(x); }
  })});
  origConsoleError.apply(console, a);
};

// ---- minimal game stub ----
const nowSec = Math.floor(Date.now() / 1000);
window.MM = {
  getModels: () => [],
  getOnlyCollectionByName: () => [],
  getCollections: () => ({
    FarmTownPlayerRelation: [{
      id: 1, farm_town_id: 4242, town_id: 7,
      type: 'farm_town_player_relation',
      lootable_at: nowSec - 10,
      status: 'own',
      player_id: 1
    }],
    BuildingOrder: []
  })
};
window.ITowns = {
  getTown: (id) => ({
    id, id_, name: 'Town ' + id,
    buildings: {}, units: {}, player_id: 1
  })
};
window.gpAjax = {
  ajaxPost: (url, action, data, cb) => {
    setTimeout(() => cb && cb({ success: true, error: false }), 30);
  }
};
window.Game = {
  market_id: 'es',
  csrfToken: 'FAKE_CSRF',
  playerId: 1,
  features: { endpoint: 'frontend_bridge' }
};
window.csrfToken = 'FAKE_CSRF';
window.GPWindowMgr = { _collections: { BuildingOrder: [] } };
window.Movements = { models: [] };
window.unsafeWindow = window;
// NOTE: do NOT add window.<fn> stubs for helpers the bot defines itself
// (scrapeInboxDom, refreshFarmsParsed, renderTimers, diagRun, ...). The
// whole bot lives in one IIFE, so a `window.foo` assignment cannot shadow
// a missing inner declaration anyway -- it would only hide the real
// ReferenceError from the panel's own paths, never fix it.
window.GM_xmlhttpRequest = (opts) => {
  // no-op in smoke; bot only calls it from real-game paths
};
window.GM_setValue = (k, v) => { window.localStorage.setItem('gb:' + k, JSON.stringify(v)); };
window.GM_getValue = (k, def) => {
  const raw = window.localStorage.getItem('gb:' + k);
  return raw == null ? def : JSON.parse(raw);
};
window.GM_addStyle = (css) => {
  const s = document.createElement('style');
  s.textContent = css;
  document.head.appendChild(s);
};
window.GM_registerMenuCommand = () => {};
// boot.js only publishes window.__grepbotTest (state, bridgePost, txRun,
// planner, every *Scan, ...) when this is === true BEFORE the IIFE runs.
// It is the only handle on the bot's internals -- everything else lives in
// one sealed IIFE. Never true under Tampermonkey. Disable with ?notest.
window.__grepbotTestMode = !location.search.includes('notest');
// runningVersion() in src/core.js reads GM_info.script.version; without
// this the panel header renders "GrepBot v0.0.0" and the driver's
// stale-artifact check can never fire. Real version is patched in below,
// after the artifact header is read.
window.GM_info = { script: { version: '0.0.0', name: 'GrepBot' } };
window.$ = () => ({
  on: () => {}, off: () => {}, click: () => {}, append: () => {},
  find: () => ({ on: () => {} }), html: () => {}, text: () => {},
  attr: () => {}, val: () => {}, css: () => {}, hide: () => {}, show: () => {}
});

// ---- load the built userscript ----
// Fetched first (not just <script src>) so the @version in the metadata
// block can be fed to the GM_info stub before the IIFE evaluates.
// Requires chromium's --allow-file-access-from-files.
const ART = '../../../grepbot.user.js';
fetch(ART).then(r => r.text()).then(src => {
  const m = src.slice(0, 600).match(/@version\s+(\d+\.\d+\.\d+)/);
  if (m) window.GM_info.script.version = m[1];
  const script = document.createElement('script');
  script.src = ART;   // load by src so throws carry a real filename/line
  script.onerror = () => {
    window.__SMOKE_ERRORS__.push({ where: 'load', msg: 'failed to load grepbot.user.js' });
  };
  document.head.appendChild(script);
}).catch(e => {
  window.__SMOKE_ERRORS__.push({ where: 'load', msg: 'fetch ' + ART + ' failed: ' + e.message });
});

// ---- settle, then report ----
setTimeout(() => {
  const ok = window.__SMOKE_ERRORS__.length === 0;
  document.title = ok
    ? 'SMOKE_OK errors=0'
    : 'SMOKE_FAIL errors=' + window.__SMOKE_ERRORS__.length + ' first='
        + (window.__SMOKE_ERRORS__[0].msg || window.__SMOKE_ERRORS__[0].reason || '?');
  document.getElementById('log').textContent =
    JSON.stringify(window.__SMOKE_ERRORS__, null, 2);
}, 3000);
</script>
</body>
</html>
